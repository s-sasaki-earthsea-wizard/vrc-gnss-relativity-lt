## 🛰️GPS中的相對論
#### 〜衛星如何測量智慧型手機的位置？〜

<img src="assets/images/title.png" width="700px">

---

### 今天的主题

<div class="simple-box">

* 🛰️GPS等GNSS是如何测量位置的？
  * 相對論效果不考慮的案例 (幾何光學)
  * 特殊相對論效果的影響
  * 一般相對論效果的影響

</div>

</br>

<div class="highlight-box">

* 📱智慧型手機在🗾地圖應用程式等時，你知道發生了什麼嗎？

</div>

---

### 前提與假設

<div class="simple-box">

* 地球是球
* 地球不自轉
* 地球電氣中性
* 地球質量分布均勻
* 地球上沒有大氣 (真空)
* 地球以外的天體 (月亮等) 不存在

</div>

</br>

<div class="highlight-box">

* 實際的地球與離開，但這樣可以簡化問題！
  * 但意外的是這個近似也可以

</div>

---

### 技術術語的補充

<div class="simple-box">

* GNSS (Global Navigation Satellite System)是人工衛星測位系統的總稱
  * 🇺🇸GPS (Global Positioning System)是GNSS的一種
  * 🇷🇺GLONASS, 🇪🇺Galileo, 🇨🇳BeiDou, 🇯🇵みちびきなど都有
* 今天我們將以日本人最親近的GPS來稱呼
  * 其實就像把所有遊戲機都稱為「任天堂」的媽媽一樣...

</div>

## 幾何光學測量位置

---

### 距離測量的簡單例子

<div class="simple-box">

- 時刻$t=0 \ (\mathrm{s})$從點$A$以速度$v=10 \ (\mathrm{m/s})$開始移動到點$B$
- 時刻$t=10 \ (\mathrm{s})$到達點$B$
- $AB$間的距離是？

</div>

$$
||AB|| = 10 \ (\text{m/s}) \times 10 \ (\text{s}) = 100 \text{m}
$$

<div class="highlight-box">

- **2點間的距離是速度$\times$時間來計算！**

</div>

---

### 光測量距離

<div class="simple-box">

* 光速: 
  * $c = 3.0 \times 10^8 \text{(m/s)}$
* 人工衛星在時刻$t_0$從點$P$發送電磁波
* 時刻$t_0 + \Delta t$智慧型手機在點$Q$接收電磁波
* 點$P$和點$Q$的距離是？

</div>

</br>

<div class="highlight-box">

* 基本是相同的： 距離 = 光速 $\times$ 時間

$$ 
||PQ|| = c \Delta t
$$

</div>

---

### 1個人工衛星測量位置

<div class="simple-box">

* 人工衛星1在時刻$t_0$從點$P_1$發送電波
* $\Delta t$後智慧型手機在點$Q$接收電波
* 點$P_1$和點$Q$的距離是$R_1 = c \Delta t$

</div>

<img src="assets/images/satellite-smartphone.svg" width="800px">

---

### 智慧型手機在哪裡？

<div class="highlight-box">

* $P_1$中心半徑$R_1$的球面$S_1$表面上的某處！

</div>

<img src="assets/images/one-satellite-positioning.svg" width="800px">

---

### 2個人工衛星測量位置

<div class="simple-box">

* 從兩個人工衛星測量相同距離
  * 智慧型手機在球$S_1$表面上的某處
  * 也在球$S_2$表面上的某處

</div>

<img src="assets/images/two-satellite-positioning.svg" width="800px">

---

### 智慧型手機位置絞窄

<div class="highlight-box">

* 2個球的共同部分是圓
* 也就是圓$C$的圓周上的某處！
* **衛星數增加，位置絞窄效果更好！**

</div>

<img src="assets/images/two-sphere-cross-section.svg" width="800px">

---

### 3個人工衛星測量位置

<div class="simple-box">

* 第3個衛星從球$S_3$得到
* 知道智慧型手機在圓$C$的圓周上
* 圓$C$和球$S_3$的交點是2點 ($Q_1, Q_2$)
* **也就是說，智慧型手機位置被絞窄到2點中的某處！**

</div>

<img src="assets/images/three-stallite-positioning.svg" width="680px">

---

### 4個人工衛星測量位置

<div class="simple-box">

* 第4個衛星從球$S_4$得到
  * 球$_4$是2個候選中的**1個**
* **4個人工衛星測量距離可以確定智慧型手機位置$Q$！**

</div>

<img src="assets/images/four-stallite-positioning.svg" width="680px">

---

### 衛星測位系統總結與補充

<div class="simple-box">

* 1個GPS衛星的信號接收，智慧型手機在球表面上的某處
* 4個衛星的信號接收，智慧型手機位置可以確定
  * 實際上，地球表面被視為另一個球，從3個衛星測量位置
  * 航空機等4個衛星測量很重要！
* **球與球共同部分，智慧型手機位置可以確定！**

</div>

## 特殊相對論效果的影響

---

### 特殊相對論的重要主張

<div class="container">

<div class="col-left">

<div class="simple-box">

* 高速運動物體在靜止觀測者眼中，時間進度變慢
  * 這是極簡化的說明！

</div>

</div>

<div class="col-right">

<img src="assets/images/einstein_1905.png" width="500px">

</div>

</div>

---

### 特殊相對論的主張具體例子

<div class="simple-box">

* 考慮地球對速度$v$等速直線運動的火箭
* **地球上看**，火箭時鐘比地球時鐘慢！

</div>

<img src="assets/images/SR-explanation.svg" width="700px">

---

### 洛倫茲因子

</br>

<div class="highlight-box">

* 火箭時鐘在$t'$秒進度時，地球時鐘是$t$秒進度
  * 這個$\gamma$被稱為洛倫茲因子

$$
t' = \frac{t}{\sqrt{1 - v^2/c^2}} = \gamma t
$$

</div>

---

### 時鐘遲緩的簡單例子

<div class="simple-box">

* 火箭速度$v = 4.2 \times 10^7 \text{(m/s)}$
* 地球上1秒進度時，火箭上0.99秒進度
  * 地球上看，**火箭時鐘只快0.01秒**

</div>

$$
\Delta t = 1 - \frac{t'}{\gamma} = 1 - \sqrt{1 - \dfrac{(4.2 \times 10^7)^2}{(3.0 \times 10^8)^2}} \simeq 0.01 \text{(s)}
$$

---

### 特殊相對論效果的時間遲緩

<div class="simple-box">

* GPS衛星速度
  * GPS衛星高度約20,000km
  * GPS衛星速度約3.9km/s
  * 簡單地考慮衛星等速直線運動
</div>

$$
\Delta t_{\mathrm{sec}} = 1 - \frac{t'}{\gamma} \simeq 1 - 8.5 \times 10^{-11}
$$

<div class="highlight-box">

* 地上1秒時鐘進度時，人工衛星時鐘比地上時鐘慢約$8.5 \times 10^{-11}$秒進度

</div>

---

### 1天內生成的時間差

<div class="simple-box">

* 1天是$24 \text{(h)} \times 60 \text{(min)} \times 60 \text{(s)} = 86400 \text{(s)}$
  * 1天內GPS衛星時鐘比地上時鐘慢：

</div>

$$
\Delta t_{\mathrm{day}} = 86400 \text{(s)} \times 8.5 \times 10^{-11} \simeq 7.3 \mathrm{(\mu s)}
$$

<div class="highlight-box">

* $ c \Delta t_{\mathrm{day}} \simeq 2.2 \text{(km)}$，所以**距離測量中不可忽略的時間差**
* GPS測量需要時間補正！

</div>

---

## 一般相對論效果的影響

---

### 一般相對論的主張

<div class="simple-box">

* 質量是時空扭曲的原因
* 這個時空扭曲是重力
* 時間是重力造成的遲緩

</div>

<div class="container">

<div class="col-left">

<img src="assets/images/Spacetime_lattice_analogy.svg" width="500px">

<div class="caption">

Mysid, Wikipedia Commons (CC BY-SA 3.0).

</div>

</div>

<div class="col-right">

<img src="assets/images/Riemann.png" width="700px">


</div>

</div>

---

### 重力如何影響時間進度？

<div class="simple-box">

* 重力越強，時間進度越慢
* 重力越弱，時間進度越快

</div>

</br>

<div class="highlight-box">

* 地面是地球中心附近重力強的地方，時鐘慢
* 人工衛星從地面高度20,000km周圍，重力弱，時鐘快

</div>

---

### 施瓦茨施爾特計量

<div class="simple-box">

* 時空扭曲(重力)的最簡單計量
  * $G$是重力常數
  * $M$是天體質量
  * $r$是天體中心到天體中心的距離
* **地球重力可以用施瓦茨施爾特計量近似**

</div>

$$
ds^2 = -\left(1-\frac{2GM}{c^2r}\right)c^2dt^2 + \left(1-\frac{2GM}{c^2r}\right)^{-1}dr^2
$$

$$
\ + \quad r^2(d\theta^2 + \sin^2\theta d\phi^2)
$$

---

### 地球重力為何可以用施瓦茨施爾特計量近似？

<div class="simple-box">

* 施瓦茨施爾特計量的前提
  * 天體是球對稱且靜止的
  * 天體不自轉
  * 天體電氣中性

</div>

<br>

<div class="highlight-box">

* 今天的地球滿足這些條件！
  * 實際的地球也用這個近似沒問題

</div>

---

### 施瓦茨施爾特計量的進一步近似

<div class="simple-box">

* 測量智慧型手機的GPS速度與光速相比非常慢，幾乎靜止，可以認為OK！
  * **施瓦茨施爾特計量的空間成分可以忽略！**

</div>

$$
ds^2 = -\left(1-\frac{2GM}{c^2r}\right)c^2dt^2 
$$

<div class="highlight-box">

* 時間伸縮只由重力引起！

</div>

---

### 地球重力造成的時間伸縮

$$
d\tau = - \frac{ds^2}{c^2} = \sqrt{1-\frac{2GM}{c^2r}} dt \simeq \left(1 - \frac{GM}{c^2r} \right) dt
$$

<div class="simple-box">

* 這裡$r$是地球中心到天體中心的距離
* 地球中心1秒進度時，半徑$r$的地方時鐘只會早進$右邊的分數$秒
  * 重力強的地方時鐘慢

</div>

---

### 地球表面與人工衛星的時間差

<div class="highlight-box">

* 地球半徑$R$
* GPS衛星高度$h$
  * GPS衛星地球中心到天體中心的距離是$R + h$

</div>

* 地球表面時鐘與GPS衛星時鐘的時間差是:

$$
\Delta t = \left(1 - \frac{GM}{c^2(R+h)}\right) - \left(1 - \frac{GM}{c^2R}\right)
$$

$$
= \frac{GM}{c^2}\left(\frac{1}{R} - \frac{1}{R+h} \right)
$$

---

### 時間差計算中使用的值

<div class="simple-box">

* 以下值代入計算
  * $G = 6.674 \times 10^{-11} \mathrm{(m^3 kg^{-1} s^{-2})}$
  * $M = 5.972 \times 10^{24} \text{(kg)}$
  * $R = 6.378 \times 10^6 \text{(m)}$
  * $h =  2.0 \times 10^7 \text{(m)}$
  * $c = 3.0 \times 10^8 \text{(m/s)}$

</div>

---

### 時間差計算結果

<div class="highlight-box">

* 1天內GPS衛星時鐘比地上時鐘快： 

$$
\Delta t_{\mathrm{day}} \simeq 45.5 \mathrm{(\mu s)}
$$

</div>

<br>

<div class="highlight-box">

* 1天內$45.5 \mathrm{\mu s}$，GPS衛星時鐘比地上時鐘快
* 特殊相對論效果的時間遲緩比大！

</div>

---

### 總計生成的時間差

<div class="simple-box">

* 特殊相對論效果的時間差是$-7.3 \mathrm{\mu s}$ (遲緩)
* 一般相對論效果的時間差是$+45.5 \mathrm{\mu s}$ (快)

</div>

<br>

<div class="highlight-box">

* 兩者相加：

$$
\Delta t_{\mathrm{total}} = 45.5 - 7.3 = +38.2 \mathrm{\mu s}
$$

* **1天內，GPS衛星比地上快$38.2 \mathrm{\mu s}$！**

</div>

---

### 時鐘差放置會怎樣？

<div class="simple-box">

* 1天內$38.2 \mathrm{\mu s}$智慧型手機快進度
* 距離換算$c \times 38.2 \mathrm{\mu s} \simeq 11.5 \text{(km)}$
* 35天內約400km (東京-大阪間距離)也偏移！
* **車導航去東京，結果大阪帶去！**

</div>

<img src="assets/images/misguide-to-Osaka.png" width="500px">

---

### 如何補正？

<div class="simple-box">

* (這個例子中)**1天內38.2$\mathrm{\mu s}$智慧型手機慢時鐘**
  * 結果是帳面平衡
  * 嚴格來說，是載不同頻率的時鐘來實現

</div>

<br>

<div class="highlight-box">

* 理論計算很優雅
* **但解決方案很驚人地簡單！**
* GNSS是優雅與簡單的結合！

</div>

---

### 總結

<div class="simple-box">

* GPS是從人工衛星到測量器的光到達時間測量來確定位置
  * 1基時是球表面，2基時是圓周，3基時是2點，4基時是1點，衛星數增加，位置絞窄
* 精確測量需要精確時間補正
  * 特殊相對論效果的時間遲緩
  * 一般相對論效果的時間快
* **相對論就在我們生活中！**

</div>
