## 🛰️Relativity in GPS
#### How do satellites measure the location of smartphones?

<img src="assets/images/title.png" width="700px">

---

### Today's Topic

<div class="simple-box">

* 🛰️How does GNSS like GPS measure position?
  * Case without considering relativistic effects (Geometric Optics)
  * Effects of Special Relativity
  * Effects of General Relativity

</div>

</br>

<div class="highlight-box">

* 📱You'll understand what's happening when your smartphone shows your location on 🗾map apps!

</div>

---

### Assumptions

<div class="simple-box">

* Earth is a sphere
* Earth does not rotate
* Earth is electrically neutral
* Earth's mass distribution is uniform
* Earth has no atmosphere (it's a vacuum)
* No other celestial bodies (like the Moon) exist

</div>

</br>

<div class="highlight-box">

* These assumptions are far from reality, but they simplify the problem!
  * Surprisingly, this approximation works well

</div>

---

### Technical Terms

<div class="simple-box">

* GNSS (Global Navigation Satellite System) is the general term for satellite-based positioning systems
  * 🇺🇸GPS (Global Positioning System) is one type of GNSS
  * Others include 🇷🇺GLONASS, 🇪🇺Galileo, 🇨🇳BeiDou, 🇯🇵Michibiki
* Today, we'll refer to it as GPS, which is most familiar to Japanese people
  * It's like calling all game consoles "Famicom" - technically not correct, but commonly used

</div>

---

## Position Measurement Using Geometric Optics

---

### Simple Example of Distance Measurement

<div class="simple-box">

- Starting from point $A$ at time $t=0 \ (\mathrm{s})$ with velocity $v=10 \ (\mathrm{m/s})$ towards point $B$
- Arriving at point $B$ at time $t=10 \ (\mathrm{s})$
- What is the distance between $A$ and $B$?

</div>

$$
||AB|| = 10 \ (\text{m/s}) \times 10 \ (\text{s}) = 100 \text{m}
$$

<div class="highlight-box">

- **Distance between two points can be calculated as speed $\times$ time!**

</div>

---

### Distance Measurement using Light

<div class="simple-box">

* Speed of light: $c = 3.0 \times 10^8 \text{(m/s)}$
* Satellite transmits electromagnetic waves from point $P$ at time $t_0$
* Smartphone receives the waves at point $Q$ at time $t_0 + \Delta t$
* What is the distance between points $P$ and $Q$?

</div>

---

### Distance Measurement using Light

<div class="highlight-box">

* Same principle: distance = speed of light $\times$ time

$$ 
||PQ|| = c \Delta t
$$

</div>

---

### Positioning with One Satellite

<div class="simple-box">

* Satellite transmits radio waves from point $P_1$ at time $t_0$, smartphone receives it after $\Delta t$
* Distance between points $P_1$ and $Q$ is $R_1 = c \Delta t$

</div>

<img src="assets/images/satellite-smartphone.svg" height="400px">

---

### Where is the Smartphone?

<div class="highlight-box">

* It's somewhere on the surface of sphere $S_1$ with center $P_1$ and radius $R_1$!

</div>

<img src="assets/images/one-satellite-positioning.svg" width="800px">

---

### Positioning with Two Satellites

<div class="simple-box">

* Similarly measuring distance from two satellites
  * Smartphone is somewhere on the surface of sphere $S_1$
  * And also on the surface of sphere $S_2$

</div>

<img src="assets/images/two-satellite-positioning.svg" width="600px">

---

### Narrowing Down the Smartphone's Position

<div class="highlight-box">

* The intersection of two spheres is a circle
* It's somewhere on the circumference of circle $C$!
* **By increasing the number of satellites, we can narrow down the position!**

</div>

<img src="assets/images/two-sphere-cross-section.svg" width="600px">

---

### Positioning with Three Satellites

<div class="simple-box">

* Getting sphere $S_3$ from the third satellite
* We know it's somewhere on the circumference of circle $C$, which intersects at two points
* **Now we're down to two possible points!**

</div>

<img src="assets/images/three-stallite-positioning.svg" width="500px">

---

### Positioning with Four Satellites

<div class="simple-box">

* Getting sphere $S_4$ from the fourth satellite
* **With distance measurements from four satellites, we can determine the smartphone's position $Q$!**

</div>

<img src="assets/images/four-stallite-positioning.svg" width="500px">

---

### Summary

<div class="simple-box">

* Receiving signals from one GPS satellite, we know the smartphone is on the surface of a sphere
* Receiving signals from four satellites, we can determine the position
* **We can determine the smartphone's position from the intersection of spheres!**

</div>

---

### Additional Notes

<div class="simple-box">
* In practice, we treat the Earth's surface as another sphere, and perform positioning with three satellites
* For aircraft, positioning from the fourth satellite is important!

</div>

## Effects of Special Relativity

---

### Important Claim of Special Relativity

<div class="container">

<div class="col-left">

<div class="simple-box">

* Objects moving at high speeds appear to time slower to observers at rest
  * This is a highly simplified explanation!

</div>

</div>

<div class="col-right">

<img src="assets/images/einstein_1905.png" width="500px">

</div>

</div>

---

### Example of Special Relativity

<div class="simple-box">

* Consider a rocket moving at speed $v$ relative to Earth
* **From Earth's perspective**, the rocket clock appears to run slower!

</div>

<img src="assets/images/SR-explanation.svg" width="700px">

---

### Lorentz Factor

</br>

<div class="highlight-box">

* When the rocket clock has advanced $t'$ seconds, the Earth clock has advanced $t$ seconds
  * This $\gamma$ is called the Lorentz factor

$$
t' = \frac{t}{\sqrt{1 - v^2/c^2}} = \gamma t
$$

</div>

---

### Simple Example of Time Dilation

<div class="simple-box">

* Let's consider a rocket with speed $v = 4.2 \times 10^7 \text{(m/s)}$
* The Earth clock advances by 1 second while the rocket clock advances by 0.99 seconds
  * From Earth's perspective, **the rocket clock is 0.01 seconds ahead**

</div>

$$
\Delta t = 1 - \frac{t'}{\gamma} = 1 - \sqrt{1 - \dfrac{(4.2 \times 10^7)^2}{(3.0 \times 10^8)^2}} \simeq 0.01 \text{(s)}
$$

---

### Effects of Special Relativity on Time

<div class="simple-box">

* Speed of GPS satellite
  * Height of GPS satellite is about 20,000 km
  * Speed of GPS satellite is about 3.9 km/s
</div>

$$
\Delta t_{\mathrm{sec}} = 1 - \frac{t'}{\gamma} \simeq 1 - 8.5 \times 10^{-11}
$$

<div class="highlight-box">

* The Earth clock advances by 1 second while the GPS satellite clock is $8.5 \times 10^{-11}$ seconds ahead

</div>

---

### Daily Time Difference

<div class="simple-box">

* 1 day is $24 \text{(h)} \times 60 \text{(min)} \times 60 \text{(s)} = 86400 \text{(s)}$
  * Daily GPS satellite clock delay:

</div>

$$
\Delta t_{\mathrm{day}} = 86400 \text{(s)} \times 8.5 \times 10^{-11} \simeq 7.3 \mathrm{(\mu s)}
$$

<div class="highlight-box">

* $ c \Delta t_{\mathrm{day}} \simeq 2.2 \text{(km)}$ so **a significant time difference occurs in distance measurement!**
* GPS positioning requires correction for this time difference!

</div>

---

## Effects of General Relativity

---

### Claim of General Relativity

<div class="simple-box">

* Mass creates spacetime distortion
* This distortion is gravity
* Time passes slower in gravity

</div>

<div class="container">

<div class="col-left">

<img src="assets/images/Spacetime_lattice_analogy.svg" width="500px">

<div class="caption">

Mysid, Wikipedia Commons (CC BY-SA 3.0).

</div>

</div>

<div class="col-right">

<img src="assets/images/Riemann.png" width="700px">


</div>

</div>

---

### How Gravity Affects Time

<div class="simple-box">

* Stronger gravity makes time pass slower
* Weaker gravity makes time pass faster

</div>

</br>

<div class="highlight-box">

* Earth's surface is closer to Earth's center, so gravity is stronger, making the clock slower
* GPS satellite is at an altitude of 20,000 km, so gravity is weaker, making the clock faster

</div>

---

### Schwarzschild Metric

<div class="simple-box">

* The simplest metric to represent spacetime distortion (gravity)
  * $G$ is the gravitational constant
  * $M$ is the mass of the body
  * $r$ is the distance from the body's center
* **Earth's gravity can be approximated by the Schwarzschild metric**

</div>

$$
ds^2 = -\left(1-\frac{2GM}{c^2r}\right)c^2dt^2 + \left(1-\frac{2GM}{c^2r}\right)^{-1}dr^2
$$

$$
\ + \quad r^2(d\theta^2 + \sin^2\theta d\phi^2)
$$

---

### Why is Earth's Gravity Approximated by the Schwarzschild Metric?

<div class="simple-box">

* Assumptions of the Schwarzschild metric
  * Body is spherically symmetric and stationary
  * Body does not rotate
  * Body is electrically neutral

</div>

<br>

<div class="highlight-box">

* Today's Earth satisfies these conditions!
  * The actual Earth has a negligible effect due to this approximation

</div>

---

### Further Approximation of Schwarzschild Metric

<div class="simple-box">

* The speed of the smartphone measuring position is very slow compared to the speed of light, so we can consider it almost stationary!
  * **We can ignore the spatial components of the Schwarzschild metric!**

</div>

$$
ds^2 = -\left(1-\frac{2GM}{c^2r}\right)c^2dt^2 
$$

<div class="highlight-box">

* Time dilation is only due to gravity!

</div>

---

### Time Dilation Due to Earth's Gravity

$$
d\tau = - \frac{ds^2}{c^2} = \sqrt{1-\frac{2GM}{c^2r}} dt \simeq \left(1 - \frac{GM}{c^2r} \right) dt
$$

<div class="simple-box">

* Here $r$ is the distance from Earth's center
* The Earth's center advances by 1 second while the point at distance $r$ advances by the right-hand side
  * Faster in stronger gravity

</div>

---

### Time Difference Between Earth and Satellite

<div class="highlight-box">

* Let's denote the Earth's radius as $R$
* Let's denote the altitude of the GPS satellite as $h$
  * Distance from Earth's center of the GPS satellite is $R + h$

</div>

* Time difference between the Earth clock and the GPS satellite clock:

$$
\Delta t = \left(1 - \frac{GM}{c^2(R+h)}\right) - \left(1 - \frac{GM}{c^2R}\right)
$$

$$
= \frac{GM}{c^2}\left(\frac{1}{R} - \frac{1}{R+h} \right)
$$

---

### Values Used in Calculation

<div class="simple-box">

* Substitute the following values:
  * $G = 6.674 \times 10^{-11} \mathrm{(m^3 kg^{-1} s^{-2})}$
  * $M = 5.972 \times 10^{24} \text{(kg)}$
  * $R = 6.378 \times 10^6 \text{(m)}$
  * $h =  2.0 \times 10^7 \text{(m)}$
  * $c = 3.0 \times 10^8 \text{(m/s)}$

</div>

---

### Calculation Result

<div class="highlight-box">

* Daily time difference between the GPS satellite clock and the Earth clock: 

$$
\Delta t_{\mathrm{day}} \simeq 45.5 \mathrm{(\mu s)}
$$

</div>

<br>

<div class="highlight-box">

* 1 day, the GPS satellite clock is 45.5 $\mathrm{\mu s}$ ahead of the Earth clock
* Larger than the time delay due to special relativity!

</div>

---

### Total Time Difference

<div class="simple-box">

* Time delay due to special relativity is $-7.3 \mathrm{\mu s}$ (delay)
* Time advance due to general relativity is $+45.5 \mathrm{\mu s}$ (advance)

</div>

<br>

<div class="highlight-box">

* Adding both:

$$
\Delta t_{\mathrm{total}} = 45.5 - 7.3 = +38.2 \mathrm{\mu s}
$$

* **1 day, the GPS satellite is 38.2 $\mathrm{\mu s}$ ahead of the Earth clock!**

</div>

---

### What Happens?

<div class="simple-box">

* 1 day, the clock is 38.2 $\mathrm{\mu s}$ ahead
* 35 days, the distance is about 400 km (Tokyo-Osaka distance)
* **If you're heading to Tokyo from Tokyo, you'll end up in Osaka!**

</div>

<img src="assets/images/misguide-to-Osaka.png" width="400px">

---

### How Are We Correcting It?

<div class="simple-box">

* **1 day, we intentionally slow down the clock by 38.2 $\mathrm{\mu s}$!**
  * Resulting in a balance
  * Strictly, we use clocks with different clock frequencies

</div>

<br>

<div class="highlight-box">

* Theoretical calculation is elegant
* **But the solution is surprisingly simple!**
* GNSS is a combination of elegance and simplicity!

</div>

---

### Summary

<div class="simple-box">

* GPS measures the time it takes for light to reach from satellites to measuring devices
  * 1 satellite: sphere surface, 2 satellites: circle circumference, 3 satellites: 2 points, 4 satellites: 1 point, and the more satellites, the more we can narrow down the position
* Accurate positioning requires accurate time correction
  * Time delay due to special relativity
  * Time advance due to general relativity
* **Relativity is everywhere in our lives!**

</div>
